<footer class="colophon">
  <p class="colophon-links">
    <a href="{{ '/feed.xml' | relative_url }}">订阅 RSS</a>
    <a href="mailto:{{ site.email }}">写信给我</a>
    {%- if site.github_username %}
    <a href="https://github.com/{{ site.github_username }}" rel="me noopener">GitHub</a>
    {%- endif %}
  </p>
  <p class="colophon-note">
    {{ 'now' | date: "%Y" }} 年，{{ site.title }}。文章欢迎转载，请注明出处。
  </p>
</footer>
