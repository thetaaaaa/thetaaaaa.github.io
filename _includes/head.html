{%- comment -%}
  作者本人的结构化描述。@id 是这个「人」在网上的稳定标识，跟着根域名走，
  一旦被外部引用就不要再改。sameAs 把这个节点接到 ORCID、GitHub 上，
  声明它们指的是同一个人——Linked Data 的「linked」就是指这个。
  字面量用 @value / @language 标了语言，中英文名是同一个属性的两个平行取值。
  这里先硬编码，跑通之后再换成 site.orcid_url 之类的变量。
{%- endcomment -%}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@id": "https://litaolin.com/#me",
  "@type": "Person",
  "name": [
    {"@value": "林立涛", "@language": "zh-Hans"},
    {"@value": "Litao Lin", "@language": "en"}
  ],
  "url": "https://litaolin.com/",
  "sameAs": [
    "https://orcid.org/0000-0001-8287-936X",
    "https://github.com/thetaaaaa"
  ],
  "knowsAbout": [
    {"@value": "数字人文", "@language": "zh-Hans"},
    {"@value": "知识组织", "@language": "zh-Hans"},
    {"@value": "古籍文本自动化处理", "@language": "zh-Hans"}
  ]
}
</script>
